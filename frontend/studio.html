<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="5.6.0">
  <meta name="app-version" content="5.6.0">
  <title>Vision AI v5.6.0 — Studio</title>
  <script>(function(){try{var t=localStorage.getItem('vision_ai_theme')||'dark';document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){}})();</script>
<style>
    :root { --bg:#0b1412; --card:rgba(18,36,32,.92); --line:rgba(45,212,191,.2); --accent:#2dd4bf; --text:#e8f5f0; --muted:#94a3b8; }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
    .wrap{max-width:1100px;margin:0 auto;padding:16px 14px 56px}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    h1{margin:0;font-size:1.35rem;color:#5eead4}
    header a{color:var(--accent);text-decoration:none;font-weight:600;font-size:.92rem}
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tabs button{flex:0 0 auto;background:rgba(255,255,255,.06);border:1px solid var(--line);color:inherit;padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.85rem}
    .tabs button.active{background:linear-gradient(135deg,#2dd4bf,#10b981);color:#042f2e}
    .panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
    .panel.active{display:block}
    label{display:block;font-size:11px;color:var(--muted);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.04em}
    select,textarea,input{width:100%;border-radius:12px;border:1px solid var(--line);background:rgba(8,20,18,.9);color:inherit;padding:11px 12px;font:inherit}
    textarea{min-height:100px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:640px){.row{grid-template-columns:1fr}}
    .actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#2dd4bf,#10b981);color:#042f2e}
    .btn.ghost{background:transparent;border:1px solid var(--line);color:#5eead4}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .msg{margin-top:10px;font-size:13px}
    .msg.err{color:#f87171}.msg.ok{color:#5eead4}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
    .card{background:rgba(0,0,0,.28);border-radius:12px;padding:11px;border:1px solid rgba(255,255,255,.06);font-size:12px;line-height:1.45}
    .preview img{max-width:100%;border-radius:12px;margin-top:10px}
    .hint{font-size:12px;color:var(--muted);margin:6px 0 0}
    .caps{font-size:11px;color:#5eead4;margin-top:4px}
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
    body { font-family: Inter, system-ui, sans-serif; background: #09090b !important; color: #fafafa; }
    .login-card, .auth-card, .settings-card, .card {
      background: #111114 !important;
      border: 1px solid rgba(255,255,255,0.08) !important;
      border-radius: 14px !important;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45) !important;
    }
    button.primary, .btn-primary, button[type="submit"] {
      background: #6366f1 !important; border: none !important; font-weight: 600 !important; border-radius: 10px !important;
    }
  </style>


  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/static/css/nova-system.css?v=560">
  <link rel="stylesheet" href="/frontend/static/css/pages-shell.css?v=560">
</head>
<body class="studio-page">
<div class="page-shell">
<header class="page-topbar"><a class="back" href="/">← Chat</a><h1>Studio</h1><a class="btn-ghost" href="/boost.html">Boost</a></header>
<main class="page-body">
<div class="wrap">
  <header>
    <div>
      <h1>Model Studio</h1>
      <div class="hint">Chat stays separate · GPU jobs via Colab/Kaggle · No unlimited free GPU claim</div>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <a href="/">Chat</a>
      <a href="/boost.html">GPU Boost</a>
      <a href="/upgrade.html">Plans</a>
    </div>
  </header>
  <div class="tabs" role="tablist">
    <button type="button" class="active" data-tab="image">Image</button>
    <button type="button" data-tab="video">Video</button>
    <button type="button" data-tab="train">Train</button>
    <button type="button" data-tab="models">Models</button>
    <button type="button" data-tab="jobs">Jobs</button>
    <button type="button" data-tab="workers">Workers</button>
  </div>

  <section id="panel-image" class="panel active">
    <label>Model</label>
    <select id="imgModel"></select>
    <div class="caps" id="imgCaps"></div>
    <label>LoRA</label>
    <select id="imgLora"><option value="">None</option></select>
    <div class="row">
      <div><label>LoRA weight</label><input id="imgLoraW" type="number" step="0.05" min="0" max="2" value="1"></div>
      <div><label>Seed (optional)</label><input id="imgSeed" type="number" placeholder="random"></div>
    </div>
    <div class="row">
      <div><label>Width</label><input id="imgW" type="number" value="512" min="256" max="1024"></div>
      <div><label>Height</label><input id="imgH" type="number" value="512" min="256" max="1024"></div>
    </div>
    <div class="row">
      <div><label>Steps</label><input id="imgSteps" type="number" value="4" min="1" max="50"></div>
      <div><label>Guidance</label><input id="imgGuid" type="number" step="0.1" value="1" min="0" max="20"></div>
    </div>
    <label>Negative prompt</label>
    <input id="imgNeg" placeholder="blurry, low quality…">
    <label>Prompt</label>
    <textarea id="imgPrompt" placeholder="Cinematic portrait…"></textarea>
    <div class="actions"><button class="btn" id="imgGen" type="button">Generate</button></div>
    <div class="msg" id="imgMsg"></div>
    <div class="preview" id="imgPreview"></div>
  </section>

  <section id="panel-video" class="panel">
    <p class="hint">SVD-XT is <strong>I2V only</strong>. Short clips on free T4 — not 60s HD.</p>
    <label>Model</label>
    <select id="vidModel"></select>
    <label>Mode</label>
    <select id="vidMode"><option value="i2v" selected>Image → Video</option><option value="t2v">Text → Video (if supported)</option></select>
    <label>Input image URL or data-URL (required for I2V)</label>
    <input id="vidInput" placeholder="https://… or data:image/png;base64,…">
    <div class="row">
      <div><label>Frames</label><input id="vidFrames" type="number" value="14" min="1" max="25"></div>
      <div><label>FPS</label><input id="vidFps" type="number" value="7" min="1" max="30"></div>
    </div>
    <label>Prompt</label>
    <textarea id="vidPrompt"></textarea>
    <div class="actions"><button class="btn" id="vidGen" type="button">Queue video job</button></div>
    <div class="msg" id="vidMsg"></div>
  </section>

  <section id="panel-train" class="panel">
    <p class="hint">Training runs on <strong>your</strong> Colab/Kaggle worker (queued → claimed → checkpoint → Drive). Not on Railway CPU.</p>
    <label>Dataset ID</label>
    <input id="trainDs" placeholder="ds_…">
    <label>Base model</label>
    <select id="trainBase"></select>
    <div class="row">
      <div><label>Rank</label><input id="trainRank" type="number" value="16"></div>
      <div><label>Epochs</label><input id="trainEpochs" type="number" value="10"></div>
    </div>
    <div class="actions"><button class="btn" id="trainStart" type="button">Queue training</button></div>
    <div class="msg" id="trainMsg"></div>
    <hr style="border-color:rgba(255,255,255,.08);margin:18px 0">
    <label>Register dataset</label>
    <input id="dsName" placeholder="Name">
    <label>Drive path</label>
    <input id="dsPath" placeholder="VISION-AI-STORAGE/DATASETS/my-set">
    <div class="actions"><button class="btn ghost" id="dsReg" type="button">Register dataset</button></div>
    <div class="msg" id="dsMsg"></div>
  </section>

  <section id="panel-models" class="panel"><div class="grid" id="modelGrid"></div></section>
  <section id="panel-jobs" class="panel"><div class="grid" id="jobGrid"></div></section>
  <section id="panel-workers" class="panel"><div class="grid" id="workerGrid"></div><p class="hint" id="workerHint"></p></section>
</div>
<script src="/frontend/static/js/studio.js?v=450"></script>
</main></div></body>
</html>
