<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-preset="humanly">
<head>
  <script>
  (function(){try{
    var t=localStorage.getItem('vision_ai_theme')||'dark';
    var p=localStorage.getItem('vision_theme_preset')||'humanly';
    if(t==='system')t=(matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
    if(t!=='light'&&t!=='dark')t='dark';
    document.documentElement.setAttribute('data-theme',t);
    document.documentElement.setAttribute('data-theme-preset',p);
    document.documentElement.style.colorScheme=t==='light'?'light':'dark';
  }catch(e){
    document.documentElement.setAttribute('data-theme','dark');
    document.documentElement.setAttribute('data-theme-preset','humanly');
  }})();
  </script>
  <style>
  html,body{background-color:#0b1220!important;color:#e8eef7}
  html[data-theme="light"],html[data-theme="light"] body{background-color:#f4f7fb!important;color:#0f172a}
  </style>
