<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-preset="humanly">
<head>
  <script>
  (function(){try{
    var t=localStorage.getItem('vision_ai_theme')||'dark';
    var p=localStorage.getItem('vision_theme_preset')||'humanly';
    if(t==='system')t=(matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
    if(t!=='light'&&t!=='dark')t='dark';
    document.documentElement.setAttribute('data-theme',t);
    document.documentElement.setAttribute('data-theme-preset',p);
    document.documentElement.style.colorScheme=t==='light'?'light':'dark';
  }catch(e){
    document.documentElement.setAttribute('data-theme','dark');
    document.documentElement.setAttribute('data-theme-preset','humanly');
  }})();
  </script>
  <style>
  html,body{background-color:#0b1220!important;color:#e8eef7}
  html[data-theme="light"],html[data-theme="light"] body{background-color:#f4f7fb!important;color:#0f172a}
  </style>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <meta name="app-version" content="5.6.9">
  <title>Settings — Vision AI</title>
  <script>
  (function () {
    try {
      var t = localStorage.getItem('vision_ai_theme') || 'dark';
      var p = localStorage.getItem('vision_theme_preset') || 'default';
      if (t === 'system') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme-preset', p);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
  </script>

  <link rel="stylesheet" href="/frontend/static/css/settings-ui.css?v=569">
</head>

    </main>

</body>
