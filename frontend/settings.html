<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="app-version" content="5.6.2">
  <title>Settings — Vision AI</title>
  <script>
  (function () {
    try {
      var t = localStorage.getItem('vision_ai_theme') || 'dark';
      var p = localStorage.getItem('vision_theme_preset') || 'default';
      if (t === 'system') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme-preset', p);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/static/css/nova-system.css?v=561">
  <link rel="stylesheet" href="/frontend/static/css/pages-shell.css?v=561">
  <link rel="stylesheet" href="/frontend/static/css/settings-ui.css?v=561">
</head>
<body class="nova-app settings-page">
  <div class="page-shell">
    <header class="page-topbar">
      <a class="back" href="/">← Chat</a>
      <h1>Settings</h1>
      <button type="button" class="btn-ghost" id="themeToggle" aria-label="Toggle light/dark">Theme</button>
    </header>
    <main class="page-body settings-main" role="main">
      <div id="content" class="settings-content">
        <div class="loading-state" style="padding:48px;text-align:center;color:var(--nv-text-muted,#71717a)">
          Loading settings…
        </div>
      </div>
    </main>
  </div>
  <script src="/frontend/static/js/auth.js?v=561"></script>
  <script src="/frontend/static/js/settings.js?v=561"></script>
</body>
</html>
