<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-preset="humanly">
<head>
  <script>
  /* Anti-FOUC: set theme BEFORE first paint (no network wait) */
  (function () {
    try {
      var t = localStorage.getItem('vision_ai_theme') || 'dark';
      var p = localStorage.getItem('vision_theme_preset') || 'humanly';
      if (t === 'system') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      if (t !== 'light' && t !== 'dark') t = 'dark';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-theme-preset', p);
      document.documentElement.style.colorScheme = t === 'light' ? 'light' : 'dark';
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.setAttribute('data-theme-preset', 'humanly');
      document.documentElement.style.colorScheme = 'dark';
    }
  })();
  </script>
  <style>
  /* Critical paint: match default dark shell so CSS load doesn't flash white */
  html, body {
    background-color: #0b1220 !important;
    color: #e8eef7;
  }
  html[data-theme="light"], html[data-theme="light"] body {
    background-color: #f4f7fb !important;
    color: #0f172a;
  }
  </style>

    .modal { width: min(520px, 92vw); background: var(--glass-bg, #122); backdrop-filter: blur(24px); border: 1px solid var(--glass-border, #444); border-radius: 16px; padding: 20px; }

    .modal textarea { min-height: 120px; font-family: ui-monospace, monospace; font-size: 0.85rem; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  </style>
