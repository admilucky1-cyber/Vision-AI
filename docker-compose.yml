# Vision AI v2.0 — local production-like stack
services:
  vision-ai:
    build: .
    ports:
      - "${PORT:-5050}:5050"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "5050"
      DEBUG: "false"
      WEB_WORKERS: "1"
    volumes:
      # Persist user data, RAG DB, downloads, logs
      - vision_data:/app/data
      - vision_chroma:/app/chroma_db
      - vision_uploads:/app/uploads
      - vision_downloads:/app/downloads
      - vision_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5050/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  vision_data:
  vision_chroma:
  vision_uploads:
  vision_downloads:
  vision_logs:
