[package]
name = "vision-pii-redactor"
version = "0.1.0"
edition = "2021"
description = "Memory-safe, high-speed PII/secrets redactor for Vision AI"
license = "MIT"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

[[bin]]
name = "vision-pii-redactor"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
